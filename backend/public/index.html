<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacra Simulator</title>
<style>
  :root { --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f24; --muted:#6b7280; --line:#d9d6cd; --accent:#0f766e; --warn:#b45309; --floor:#ebe8df; --obst:#b9b3a4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --panel:#1d2026; --ink:#e8e6e1; --muted:#9aa1ad; --line:#30343c; --accent:#5eead4; --warn:#fbbf24; --floor:#23272e; --obst:#4a505b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
  @media (max-width:800px) { main { grid-template-columns:minmax(0,1fr); } }
  h1 { font-size:18px; margin:0 0 4px; } p { margin:0 0 8px; color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  canvas { width:100%; aspect-ratio:1; display:block; border-radius:8px; background:var(--floor); touch-action:none; cursor:grab; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  input[type=text] { flex:1; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
  button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  #log { height:340px; overflow:auto; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .user { color:var(--accent); } .err { color:var(--warn); } .dim { color:var(--muted); }
  #status { font-weight:600; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Simulacra simulator</h1>
    <p>A browser stand-in for the headset, speaking the same device protocol. Top-down view. Drag the blue dot to move the user; scroll over the canvas to turn their head. Objects here are simulated and reported to the AI as such.</p>
    <canvas id="c" width="700" height="700"></canvas>
    <div class="row">
      <input id="text" type="text" value="Hey, can you come over here?" aria-label="Say something">
      <button id="say">Say</button>
      <button id="mic">Mic off</button>
      <button id="stop">Interrupt</button>
    </div>
  </section>
  <section class="panel">
    <div><span id="status">connecting</span> <span id="brain" class="dim"></span></div>
    <div id="log" aria-live="polite"></div>
  </section>
</main>
<script>
const RATE = 24000, SIZE = 6; // room is SIZE x SIZE metres, origin at centre
const $ = (id) => document.getElementById(id);
const log = (text, cls = '') => { const d = document.createElement('div'); d.className = cls; d.textContent = text; $('log').append(d); $('log').scrollTop = 1e9; };

// ---- world (device side). x right, z up-screen, matching Unity's floor plane.
const user = { pos: [0, 1.6, -2.2], yaw: 0 };
const avatar = { pos: [0, 0, 0.2], yaw: Math.PI, state: 'idle', goal: null, face: null, done: null };
const objects = [
  { id: 'table_1', label: 'table', pos: [-1.4, 0.4, 1.0], size: [1.4, 0.75, 0.8], source: 'simulated', confidence: 1, born: Date.now() },
  { id: 'chair_1', label: 'chair', pos: [1.5, 0.45, 1.6], size: [0.5, 0.9, 0.5], source: 'simulated', confidence: 1, born: Date.now() },
];
const counters = { table: 1, chair: 1 };
const fwd = (yaw) => [Math.sin(yaw), 0, Math.cos(yaw)];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[2] - b[2]);
const inRoom = (p) => Math.abs(p[0]) < SIZE / 2 - 0.25 && Math.abs(p[2]) < SIZE / 2 - 0.25;
const blocked = (p) => objects.some((o) => Math.abs(p[0] - o.pos[0]) < o.size[0] / 2 + 0.22 && Math.abs(p[2] - o.pos[2]) < o.size[2] / 2 + 0.22);
const clearLine = (a, b) => { const n = Math.ceil(dist(a, b) / 0.05); for (let i = 1; i <= n; i++) { const p = [a[0] + (b[0] - a[0]) * i / n, 0, a[2] + (b[2] - a[2]) * i / n]; if (!inRoom(p) || blocked(p)) return false; } return true; };

// The simulator has no path planner: it walks straight lines and refuses when one is blocked.
// (The Unity client uses a real NavMesh.) Enough to exercise success AND failure feedback.
function standPoint(target, r) {
  const base = Math.atan2(avatar.pos[0] - target[0], avatar.pos[2] - target[2]);
  for (const rr of [r, r + 0.3, r + 0.7]) for (let i = 0; i < 12; i++) {
    const a = base + Math.ceil(i / 2) * (Math.PI / 6) * (i % 2 ? 1 : -1);
    const p = [target[0] + Math.sin(a) * rr, 0, target[2] + Math.cos(a) * rr];
    if (inRoom(p) && !blocked(p) && clearLine(avatar.pos, p)) return p;
  }
  return null;
}
function resolve(id) {
  if (id === 'user') return { pos: [user.pos[0], 0, user.pos[2]], r: 1.2 };
  const o = objects.find((x) => x.id === id);
  return o ? { pos: o.pos, r: Math.min(2, Math.max(0.6, Math.max(o.size[0], o.size[2]) / 2 + 0.45)) } : null;
}
function finish(ok, reason, data) { const d = avatar.done; avatar.goal = avatar.face = avatar.done = null; avatar.state = 'idle'; d && d(ok, reason, data); }
function handleAction(m) {
  const reply = (ok, reason, data) => { send({ type: 'action_result', id: m.id, status: ok ? 'succeeded' : 'failed', reason, data }); log(`  ${m.action} ${m.target_id ?? ''} -> ${ok ? 'ok' : 'FAILED: ' + reason}`, ok ? 'dim' : 'err'); };
  log(`action ${m.action} ${m.target_id ?? ''}`, 'dim');
  const target = m.action === 'approach_user' ? 'user' : m.target_id;
  switch (m.action) {
    case 'walk_to': case 'inspect_object': case 'approach_user': {
      const t = resolve(target); if (!t) return reply(false, `unknown target '${target}'`);
      if (avatar.done) finish(false, 'superseded by a newer action');
      const p = dist(avatar.pos, t.pos) <= t.r + 0.25 ? avatar.pos : standPoint(t.pos, t.r);
      if (!p) return reply(false, `there is no reachable floor next to ${target}`);
      avatar.goal = p; avatar.face = t.pos; avatar.state = 'walking';
      avatar.done = (ok, reason) => reply(ok, reason, { metres_from_target: +dist(avatar.pos, t.pos).toFixed(1) });
      return;
    }
    case 'look_at': { const t = resolve(target); if (!t) return reply(false, `unknown target '${target}'`); if (avatar.done) finish(false, 'superseded'); avatar.goal = avatar.pos; avatar.face = t.pos; avatar.state = 'turning'; avatar.done = (ok, r) => reply(ok, r); return; }
    case 'stop': if (avatar.done) finish(false, 'stopped'); return reply(true);
    case 'register_marker': {
      const label = String(m.params?.label ?? 'object').toLowerCase().replace(/[^a-z0-9]+/g, '_'); const f = fwd(user.yaw);
      const p = [user.pos[0] + f[0] * 1.5, 0.3, user.pos[2] + f[2] * 1.5];
      if (!inRoom(p)) return reply(false, 'could not tell where the user is pointing');
      counters[label] = (counters[label] ?? 0) + 1; const o = { id: `${label}_${counters[label]}`, label, pos: p, size: [0.5, 0.5, 0.5], source: 'manual', confidence: 1, born: Date.now() };
      objects.push(o); return reply(true, undefined, { id: o.id, label, origin: 'registered by the user, not camera-detected' });
    }
    default: return reply(false, `this device does not implement action '${m.action}'`);
  }
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (avatar.goal) {
    const d = dist(avatar.pos, avatar.goal);
    const aim = d > 0.03 ? avatar.goal : avatar.face;
    const want = Math.atan2(aim[0] - avatar.pos[0], aim[2] - avatar.pos[2]);
    let diff = Math.atan2(Math.sin(want - avatar.yaw), Math.cos(want - avatar.yaw));
    const aligned = dist(avatar.pos, aim) < 0.05 || Math.abs(diff) < 0.08;
    avatar.yaw += Math.sign(diff) * Math.min(Math.abs(diff), 3.5 * dt);
    if (d > 0.03) { if (Math.abs(diff) < 0.4) { const s = Math.min(d, 0.9 * dt); avatar.pos = [avatar.pos[0] + Math.sin(want) * s, 0, avatar.pos[2] + Math.cos(want) * s]; avatar.state = 'walking'; } else avatar.state = 'turning'; }
    else if (aligned) finish(true); else avatar.state = 'turning';
  }
  draw(); requestAnimationFrame(tick);
}

// ---- drawing
const cv = $('c'), g = cv.getContext('2d'), S = cv.width / SIZE;
const px = (p) => [cv.width / 2 + p[0] * S, cv.height / 2 - p[2] * S];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v);
function draw() {
  g.clearRect(0, 0, cv.width, cv.height); g.font = '14px system-ui'; g.textAlign = 'center';
  for (const o of objects) { const [x, y] = px(o.pos); g.fillStyle = o.source === 'manual' ? css('--warn') : css('--obst'); g.fillRect(x - o.size[0] * S / 2, y - o.size[2] * S / 2, o.size[0] * S, o.size[2] * S); g.fillStyle = css('--ink'); g.fillText(o.id, x, y - o.size[2] * S / 2 - 6); }
  const body = (p, yaw, color, name) => { const [x, y] = px(p); const f = fwd(yaw); g.fillStyle = color; g.beginPath(); g.arc(x, y, 0.2 * S, 0, 7); g.fill(); g.strokeStyle = color; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + f[0] * 0.5 * S, y - f[2] * 0.5 * S); g.stroke(); g.fillStyle = css('--ink'); g.fillText(name, x, y + 0.2 * S + 16); };
  body(user.pos, user.yaw, '#3b82f6', 'you'); body(avatar.pos, avatar.yaw, css('--accent'), 'Sim · ' + avatar.state);
}
let drag = false;
const toWorld = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width - 0.5) * SIZE, 0, -((e.clientY - r.top) / r.height - 0.5) * SIZE]; };
cv.addEventListener('pointerdown', (e) => { drag = true; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', () => (drag = false));
cv.addEventListener('pointermove', (e) => { if (!drag) return; const p = toWorld(e); if (inRoom(p)) user.pos = [p[0], 1.6, p[2]]; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); user.yaw += e.deltaY * 0.003; }, { passive: false });

// ---- backend link
let ws; const send = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/device`);
  ws.onopen = () => { $('status').textContent = 'connected'; send({ type: 'hello', protocol: 1, device: 'browser-sim', capabilities: { vision: false, navmesh: false } }); sendWorld(); };
  ws.onclose = () => { $('status').textContent = 'disconnected, retrying'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'ready') $('brain').textContent = `brain: ${m.brain}` + (m.brain === 'mock' ? ' (keyword rules, not AI)' : '');
    else if (m.type === 'audio') play(m.pcm16);
    else if (m.type === 'audio_stop') flush();
    else if (m.type === 'action') handleAction(m);
    else if (m.type === 'transcript') log(`${m.role === 'user' ? 'You' : 'Sim'}: ${m.text}`, m.role === 'user' ? 'user' : '');
    else if (m.type === 'log') log(`[${m.level}] ${m.message}`, 'err');
  };
}
const sendWorld = () => send({ type: 'world', world: {
  user: { pos: user.pos, fwd: fwd(user.yaw) }, avatar: { pos: avatar.pos, fwd: fwd(avatar.yaw), state: avatar.state },
  objects: objects.map((o) => ({ id: o.id, label: o.label, pos: o.pos, size: o.size, source: o.source, confidence: o.confidence, lastSeen: (Date.now() - o.born) / 1000, reachable: true })),
  room: { source: 'simulated', floorY: 0, size: [SIZE, 0, SIZE], obstacles: objects.length, navmesh: false } } });
setInterval(sendWorld, 400);

// ---- audio: PCM16 24 kHz both ways
let ctx, playHead = 0, sources = [], micOn = false, speakingUntil = 0;
const audio = () => (ctx ??= new AudioContext({ sampleRate: RATE }));
function play(b64) {
  const bin = atob(b64), n = bin.length / 2, buf = audio().createBuffer(1, n, RATE), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) { let s = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8); if (s > 32767) s -= 65536; ch[i] = s / 32768; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
  playHead = Math.max(playHead, ctx.currentTime + 0.05); src.start(playHead); playHead += buf.duration; speakingUntil = playHead; sources.push(src); src.onended = () => (sources = sources.filter((x) => x !== src));
}
function flush() { for (const s of sources) try { s.stop(); } catch {} sources = []; playHead = 0; speakingUntil = 0; }
async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const worklet = `class P extends AudioWorkletProcessor{constructor(){super();this.b=[]}process(i){const c=i[0][0];if(c){for(const s of c)this.b.push(Math.max(-1,Math.min(1,s))*32767);if(this.b.length>=1440){this.port.postMessage(Int16Array.from(this.b));this.b=[]}}return true}}registerProcessor('p',P)`;
  await audio().audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(ctx, 'p'); ctx.createMediaStreamSource(stream).connect(node);
  node.port.onmessage = (e) => { if (!micOn) return; const u8 = new Uint8Array(e.data.buffer); let s = ''; for (const b of u8) s += String.fromCharCode(b); send({ type: 'audio', pcm16: btoa(s) }); };
}
let micReady = false;
$('mic').onclick = async () => { try { audio().resume(); if (!micReady) { await startMic(); micReady = true; } micOn = !micOn; $('mic').textContent = micOn ? 'Mic on' : 'Mic off'; $('mic').classList.toggle('on', micOn); } catch (e) { log('microphone unavailable: ' + e.message, 'err'); } };
const say = () => { audio().resume(); const t = $('text').value.trim(); if (t) { send({ type: 'text', text: t }); $('text').value = ''; } };
$('say').onclick = say; $('text').addEventListener('keydown', (e) => e.key === 'Enter' && say());
$('stop').onclick = () => { flush(); send({ type: 'interrupt' }); };
connect(); requestAnimationFrame(tick);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacra setup</title>
<style>
  body { margin: 0; background: #101418; color: #e8edf2; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: #b8c4cf; margin: 6px 0 18px; }
  label { display: block; font-weight: 600; margin: 22px 0 4px; }
  .hint { font-size: 13px; color: #8996a3; margin: 0 0 8px; }
  a { color: #7db3ff; }
  input { width: 100%; box-sizing: border-box; font: 15px ui-monospace, monospace; padding: 11px 12px; border-radius: 9px; border: 1px solid #46525e; background: #171d23; color: inherit; }
  button { font: inherit; font-weight: 600; margin-top: 24px; padding: 12px 22px; border-radius: 9px; border: 0; background: #2a6fd0; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #now, #result { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: #171d23; border: 1px solid #2c3742; white-space: pre-line; }
  .ok { color: #6fdc8c; } .bad { color: #ff8389; } .warn { color: #f4c06a; }
</style>
</head>
<body>
<main>
  <h1>Simulacra setup</h1>
  <p>Paste your keys and press Save. They are checked, saved on this computer and used straight away. No restart.</p>
  <div id="now">Checking…</div>

  <label for="openai">OpenAI key <span class="hint">— hearing and voice. This one alone is enough to talk to the character.</span></label>
  <div class="hint">Get one at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>. Starts with <code>sk-</code>.</div>
  <input id="openai" type="password" autocomplete="off" placeholder="sk-…">

  <label for="anthropic">Anthropic key <span class="hint">— optional. Lets Claude do the thinking.</span></label>
  <div class="hint">Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>. Starts with <code>sk-ant-</code>.</div>
  <input id="anthropic" type="password" autocomplete="off" placeholder="sk-ant-…">

  <button id="save">Save</button>
  <div id="result" hidden></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const minds = { claude: 'Claude thinks', realtime: 'OpenAI speech-to-speech', mock: 'keyword rules only (not AI)' };
function show(s) {
  const voice = s.voice ? '<span class="ok">Voice: on</span>' : '<span class="bad">Voice: off — add an OpenAI key</span>';
  const mind = s.brain === 'mock' ? '<span class="bad">Mind: ' + minds.mock + '</span>' : '<span class="ok">Mind: ' + minds[s.brain] + '</span>';
  $('now').innerHTML = 'Right now\n' + voice + '\n' + mind;
}
fetch('/setup/status').then((r) => r.json()).then(show).catch(() => { $('now').textContent = 'The backend is not answering.'; });
$('save').onclick = async () => {
  const body = { openaiKey: $('openai').value, anthropicKey: $('anthropic').value };
  if (!body.openaiKey.trim() && !body.anthropicKey.trim()) return;
  $('save').disabled = true;
  $('save').textContent = 'Checking…';
  try {
    const r = await fetch('/setup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || 'failed');
    const line = (name, v) => v === 'skipped' ? '' : v === 'ok' ? '<span class="ok">' + name + ' key works.</span>\n' : v === 'rejected' ? '<span class="bad">' + name + ' rejected this key. It was not saved. Check for a missing character.</span>\n' : '<span class="warn">' + name + ' could not be reached to check the key. It was saved anyway.</span>\n';
    let html = line('OpenAI', s.openai) + line('Anthropic', s.anthropic);
    if (s.openai === 'ok' || s.anthropic === 'ok') html += s.saved ? 'Saved. Open the <a href="/xr/">headset page</a> or the <a href="/">simulator</a> and talk.' : '<span class="warn">In use now, but could not be written to disk: paste again after a restart.</span>';
    $('result').innerHTML = html;
    $('result').hidden = false;
    show(s);
    if (s.openai !== 'rejected') $('openai').value = '';
    if (s.anthropic !== 'rejected') $('anthropic').value = '';
  } catch (e) {
    $('result').innerHTML = '<span class="bad">' + e.message + '</span>';
    $('result').hidden = false;
  }
  $('save').disabled = false;
  $('save').textContent = 'Save';
};
</script>
</body>
</html>
